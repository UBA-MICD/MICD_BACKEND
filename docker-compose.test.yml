# Self-contained integration-test stack.
#
# Brings up throwaway Postgres + Orthanc + backend on an isolated network, then
# runs the Jest integration suites from inside that network against the live
# services. Everything is ephemeral (no named volumes) and uses distinct
# container names + network so it can run alongside the main `docker-compose.yml`
# stack without colliding. No host ports are published — the runner talks to the
# services by name. No .env is required; test secrets are inlined below.
#
# Run with:  make test-integration-docker
#            (or: docker compose -f docker-compose.test.yml up --build \
#                   --abort-on-container-exit --exit-code-from tests)

services:
  postgres:
    # Digest-pinned STOCK postgres. Do NOT use the `postgres:16-alpine` /
    # `16-bookworm` tags here: in this monorepo those tags are locally overridden
    # by the marketplace UserService image, which bakes an Auth0-based `users`
    # table into /docker-entrypoint-initdb.d and would collide with this
    # backend's own auth `users` table. Pinning by digest keeps the test stack
    # hermetic and immune to local tag contamination.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: micd-test-postgres
    environment:
      POSTGRES_DB: micd
      POSTGRES_USER: micd
      # Non-default: the backend runs with NODE_ENV=production, which fails fast
      # on the literal "micd"/"orthanc" credentials (config/env.ts).
      POSTGRES_PASSWORD: test-db-secret
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micd -d micd"]
      interval: 5s
      timeout: 5s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:24.1.2
    platform: linux/amd64
    container_name: micd-test-orthanc
    environment:
      ORTHANC__NAME: "MICD Test Orthanc"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"orthanc": "test-orthanc-secret"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    tmpfs:
      - /var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, base64; req=urllib.request.Request('http://localhost:8042/system'); req.add_header('Authorization','Basic '+base64.b64encode(b'orthanc:test-orthanc-secret').decode()); urllib.request.urlopen(req,timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: micd-test-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: micd
      DB_USER: micd
      DB_PASSWORD: test-db-secret
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: orthanc
      ORTHANC_PASSWORD: test-orthanc-secret
      JWT_SECRET: test-access-secret-not-for-production
      JWT_REFRESH_SECRET: test-refresh-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_ROUNDS: 4
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: micd-test-runner
    restart: "no"
    environment:
      BACKEND_URL: http://backend:3000
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: orthanc
      ORTHANC_PASSWORD: test-orthanc-secret
      TEST_USER_EMAIL: test@micd.local
      TEST_USER_PASSWORD: testpassword
      # Same secret the backend signs with, so the RBAC suite can mint validly
      # signed role-specific tokens (see tests/helpers/auth.ts getAuthHeaderFor).
      JWT_SECRET: test-access-secret-not-for-production
      JWT_REFRESH_SECRET: test-refresh-secret-not-for-production
    volumes:
      # Sample DICOM used by the upload/orthanc suites (excluded from the image).
      - ./.data.example:/app/.data.example:ro
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: micd-test
