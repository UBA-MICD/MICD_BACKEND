services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: micd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-micd}
      POSTGRES_USER: ${DB_USER:-micd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-micd} -d ${DB_NAME:-micd}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orthanc DICOM server ─────────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc:24.1.2
    platform: linux/amd64
    container_name: micd-orthanc
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "MICD Orthanc"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-orthanc}": "${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env}"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      VERBOSE_ENABLED: "true"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    ports:
      - "${ORTHANC_HTTP_PORT:-8042}:8042"
      - "${ORTHANC_DICOM_PORT:-4242}:4242"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, base64; req=urllib.request.Request('http://localhost:8042/system'); req.add_header('Authorization','Basic '+base64.b64encode(b'${ORTHANC_USERNAME:-orthanc}:${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env}').decode()); urllib.request.urlopen(req,timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express / Node.js) ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: micd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-micd}
      DB_USER: ${DB_USER:-micd}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env}
      AI_INFERENCE_URL: ${AI_INFERENCE_URL:-http://micd-inference:8000}
      AI_INFERENCE_TIMEOUT_MS: ${AI_INFERENCE_TIMEOUT_MS:-30000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@micd.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MICD <no-reply@micd.local>}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ZENODO_TIMEOUT_MS: ${ZENODO_TIMEOUT_MS:-10000}
      # Unset by default: Node then binds dual-stack, which the container
      # healthcheck's localhost (::1) needs. Not the desktop case — see
      # .env.example.
      HOST: ${HOST:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-60}
      RATE_LIMIT_PASSWORD_RESET_MAX: ${RATE_LIMIT_PASSWORD_RESET_MAX:-10}
      RATE_LIMIT_INVITE_MAX: ${RATE_LIMIT_INVITE_MAX:-20}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-1000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Seeder (TypeScript runner) ──────────────────────────────────────────────
  micd-seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: micd-seeder
    profiles:
      - seed
    env_file:
      - .env
    environment:
      API_HEALTH_URL: http://micd-backend:3000/api/health
      UPLOAD_URL: http://micd-backend:3000/api/v1/studies/upload
      STAGING_DIR: /app/data/staging/dicom
    volumes:
      - ./data/staging/dicom:/app/data/staging/dicom
      - ./scripts:/app/scripts
    depends_on:
      - backend
    entrypoint: ["npx", "ts-node", "scripts/seed_api.ts"]

volumes:
  postgres-data:
  orthanc-data:

# Named network so the MICD_WEB frontend can join it (external: true on its side)
# and reach this stack's `backend` service by name.
networks:
  default:
    name: micd
