coverage:
  status:
    project:
      default:
        target: 80%
        threshold: null
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 5%
        if_ci_failed: error

ignore:
  - "node_modules/**/*"
  - "dist/**/*"
  - "coverage/**/*"
  - "scripts/**/*"
  - "**/*.test.ts"
  - "jest.config.js"
