repos:
  # Standard hooks provided by pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Static analysis for shell scripts using ShellCheck
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  # Format code using Prettier for TS, JS, CSS, HTML, JSON, Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, css, html, json, markdown]

  # Static analysis for TypeScript files using ESLint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.6.0
    hooks:
      - id: eslint
        additional_dependencies:
          - eslint@8.56.0
          - typescript@5.4.5
          - '@typescript-eslint/parser@6.19.0'
          - '@typescript-eslint/eslint-plugin@6.19.0'
        types: [ts, tsx]

  # English spell checker to maintain consistency across the codebase
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        types_or: [ts, tsx, javascript, html, css, markdown]

  # Run backend integration tests on push stage
  - repo: local
    hooks:
      - id: test-backend-integration
        name: Run Backend Integration Tests
        entry: npm run test:integration
        language: system
        pass_filenames: false
        stages: [push]
