# Staging data plane — Postgres + Orthanc + backend, all INTERNAL.
#
# No service here publishes a host port: the only public entrypoint is the Caddy
# edge in the web repo (docs/staging-deployment/plan.md §1), which reaches
# `backend:3000` over the shared external `micd` network. TLS is terminated at
# that edge, so the backend serves plain HTTP (TLS_ENABLED=false).
#
# Images are PULLED from GHCR — the VPS never builds (plan §4). Memory limits are
# tuned for a 4 GB host (plan §2); every value is overridable from .env.staging.
#
# Prerequisites (one-time on the VPS — plan §6):
#   docker network create micd
#   cp .env.staging.example .env.staging   # then fill in every secret
#
# Usage:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging pull
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --no-build

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    # Digest-pinned STOCK postgres:16 — NOT the `-alpine` tag, which is
    # contaminated in this workspace by a marketplace image (see backend
    # CLAUDE.md / spec.md C5). Same digest already vetted in docker-compose.prod.yml.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: micd-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-micd}
      POSTGRES_USER: ${DB_USER:-micd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port: only backend reaches it by service name over `micd`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-micd} -d ${DB_NAME:-micd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-256M}
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-128M}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    networks:
      - micd

  # ── Orthanc DICOM server ─────────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc@sha256:dc18595aded1daf3a0de17570ac3a1384a204292785c949b7d08d23d15dcd411
    platform: linux/amd64
    container_name: micd-orthanc
    restart: always
    # No cap_drop: the entrypoint needs root to write /etc/hostid on first boot.
    security_opt:
      - no-new-privileges:true
    environment:
      ORTHANC__NAME: "MICD Orthanc (staging)"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-orthanc}": "${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env.staging}"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      VERBOSE_ENABLED: "false"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    # No host port: the backend proxies Orthanc's REST API; browsers never reach it.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, base64; req=urllib.request.Request('http://localhost:8042/system'); req.add_header('Authorization','Basic '+base64.b64encode(b'${ORTHANC_USERNAME:-orthanc}:${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env.staging}').decode()); urllib.request.urlopen(req,timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${ORTHANC_MEM_LIMIT:-1024M}
        reservations:
          memory: ${ORTHANC_MEM_RESERVE:-384M}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    networks:
      - micd

  # ── Backend (Express / Node.js) ──────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/uba-micd/micd_backend:staging}
    container_name: micd-backend
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Uploads use multer in-memory storage; the image writes nothing outside
    # dist/node_modules at runtime.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-micd}
      DB_USER: ${DB_USER:-micd}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set in .env.staging}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env.staging}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@micd.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env.staging}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ZENODO_TIMEOUT_MS: ${ZENODO_TIMEOUT_MS:-10000}
      # TLS is terminated at the Caddy edge — the backend speaks plain HTTP.
      TLS_ENABLED: "false"
      # Behind the Caddy edge: one trusted proxy hop for correct client IPs.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # The SPA is served same-origin through the edge, so no cross-origin entry
      # is needed. The desktop app sends no Origin, so it is allowed regardless.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://dicomviewermed.online}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MICD <no-reply@dicomviewermed.online>}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-60}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-1000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    # No host port: the Caddy edge (web repo) reaches this by service name.
    healthcheck:
      # Readiness (Postgres + Orthanc reachable) — the "safe to route traffic" signal.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-448M}
        reservations:
          memory: ${BACKEND_MEM_RESERVE:-256M}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    networks:
      - micd

volumes:
  postgres-data:
  orthanc-data:

# Shared, externally-created network (docker network create micd). The web repo's
# Caddy + static frontend join the same network to reach `backend:3000`.
networks:
  micd:
    external: true
